server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: community-governance-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/community_governance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:community_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

app:
  security:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:5173}
    data-encryption-key: ${DATA_ENCRYPTION_KEY:}
  attachment:
    storage-root: ${ATTACHMENT_STORAGE_ROOT:./data/attachments}
    max-file-size-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - application/pdf
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      real-name: ${BOOTSTRAP_ADMIN_REAL_NAME:系统管理员}

logging:
  level:
    root: INFO
    com.cunzhi.governance: INFO
